apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantflow-ingress
  namespace: quantflow
  annotations:
    # 需要集群已安装 ingress-nginx 控制器（ingressClassName: nginx）。
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: quantflow.example.com   # 改为你的域名或删掉 host 走 IP 访问
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
