apiVersion: v1
kind: ConfigMap
metadata:
  name: quantflow-config
  namespace: quantflow
data:
  # 演示环境使用内置 fixture 行情（无网络 / 无 tushare token 依赖）；
  # 接入真实行情改为 tushare 并配置 QF_TUSHARE_TOKEN（建议放 Secret）。
  QF_MARKET_PROVIDER: "fixture"
  # SQLite 落盘路径（挂载 PVC 持久化）
  QF_DB_PATH: "/srv/app/data/quantflow.db"
  # Worker N6 运行参数
  QF_WORKER_POLL_INTERVAL: "1"
  QF_WORKER_STALE_TIMEOUT: "300"
  QF_WORKER_EXECUTOR_WORKERS: "4"
  # 跨域（按需放开前端来源）
  QF_CORS_ORIGINS: "http://localhost:8080"
  QF_DEBUG: "0"
  # ---- V1.1 N1 LLM 策略助手 ----
  # 默认 mock（无需 key，可演示）；启用真实大模型改为 openai 并配置 key：
  #   QF_LLM_PROVIDER: "openai"
  #   QF_LLM_API_KEY: "<你的 API Key>"   # 建议放 Secret 而非 ConfigMap
  # 兼容 OpenAI 协议网关（DeepSeek / 通义 / 自建）可一并覆盖 QF_LLM_BASE_URL / QF_LLM_MODEL
  QF_LLM_PROVIDER: "mock"
  QF_LLM_API_KEY: ""
  QF_LLM_BASE_URL: "https://api.openai.com/v1"
  QF_LLM_MODEL: "gpt-4o-mini"
