apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantflow-backend
  namespace: quantflow
  labels:
    app: quantflow-backend
    app.kubernetes.io/part-of: quantflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantflow-backend
  template:
    metadata:
      labels:
        app: quantflow-backend
    spec:
      containers:
        - name: backend
          image: quantflow-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: quantflow-config
            - secretRef:
                name: quantflow-secret
          volumeMounts:
            - name: data
              mountPath: /srv/app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quantflow-data
