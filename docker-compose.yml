version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - QF_DEBUG=0
      - QF_CORS_ORIGINS=http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
